default_view: prs
default_mode: unified
theme: default
vim_mode: true
auto_refresh: true
refresh_interval: 60

preview:
  open: true
  position: right
  width: 50
accounts:
  - id: gh-personal
    name: GitHub Personal
    provider: github
    host: github.com
    auth_ref: github

  - id: gl-work
    name: GitLab Engineering
    provider: gitlab
    host: gitlab.com
    auth_ref: gitlab

  - id: cb-oss
    name: Codeberg OSS
    provider: forgejo
    host: codeberg.org
    auth_ref: codeberg

pr_sections:
  - title: Needs Review
    filters: "is:open review-requested:@me"
    limit: 25
  - title: My PRs
    filters: "is:open author:@me"
    limit: 25
  - title: Subscribed
    filters: "is:open"
    limit: 25

issue_sections:
  - title: Assigned
    filters: "is:open assignee:@me"
    limit: 25
  - title: Created
    filters: "is:open author:@me"
    limit: 25
  - title: Mentioned
    filters: "is:open mentions:@me"
    limit: 25
