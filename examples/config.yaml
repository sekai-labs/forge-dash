# Example ForgeDash Multi-Account Configuration
# Destination: ~/.config/forgedash/config.yaml

default_view: prs          # Initial view: prs, issues, notifications
default_mode: unified      # Mode: unified (all accounts aggregated) or scoped (single account)
theme: default             # Themes: default, nord, dracula, gruvbox, light
vim_mode: true             # Vim navigation (j/k/g/G/h/l)
auto_refresh: true         # Background polling
refresh_interval: 60       # Interval in seconds

preview:
  open: true               # Open preview pane on startup
  position: right          # Split position: "right" or "bottom"
  width: 50                # Percentage width when on the right

accounts:
  # 1. GitHub (Personal)
  - id: gh-personal
    name: GitHub Personal
    provider: github
    host: github.com
    auth_ref: github

  # 2. GitLab (Work / Self-Managed)
  - id: gl-work
    name: GitLab Engineering
    provider: gitlab
    host: gitlab.com
    auth_ref: gitlab

  # 3. Codeberg / Forgejo (Open Source)
  - id: cb-oss
    name: Codeberg OSS
    provider: forgejo
    host: codeberg.org
    auth_ref: codeberg

# Section Tabs in PR view
pr_sections:
  - title: Needs Review
    filters: "is:open review-requested:@me"
    limit: 25
  - title: My PRs
    filters: "is:open author:@me"
    limit: 25
  - title: Subscribed
    filters: "is:open"
    limit: 25

# Section Tabs in Issues view
issue_sections:
  - title: Assigned
    filters: "is:open assignee:@me"
    limit: 25
  - title: Created
    filters: "is:open author:@me"
    limit: 25
  - title: Mentioned
    filters: "is:open mentions:@me"
    limit: 25
