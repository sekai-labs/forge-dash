name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Formatting
        run: |
          diff -u <(echo -n) <(gofmt -d .)

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Build Binary
        run: make build
