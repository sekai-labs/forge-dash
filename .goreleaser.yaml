version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: forgedash
    main: ./cmd/forgedash
    binary: forgedash
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/forgedash/forgedash/internal/interfaces/cli.Version={{ .Version }} -X github.com/forgedash/forgedash/internal/interfaces/cli.CommitSHA={{ .ShortCommit }} -X github.com/forgedash/forgedash/internal/interfaces/cli.BuildDate={{ .Date }}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - examples/config.yaml

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
